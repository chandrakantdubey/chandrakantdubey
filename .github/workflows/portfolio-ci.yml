name: Validate portfolio

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies for high-severity advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Lint portfolio and engine
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
      - name: Validate field model and portfolio content
        run: npm test
      - name: Exercise real browser and mobile layout
        run: npm run test:browser
      - name: Upload desktop and mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-001-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check output artifacts
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/Chandrakant_Dubey.pdf
          test ! -f api/send-email.ts
