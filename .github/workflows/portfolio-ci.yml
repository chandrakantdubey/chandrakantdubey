name: Validate portfolio

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint new application
        run: npm run lint:lab
      - name: Typecheck and build
        run: npm run build
      - name: Validate simulator invariants
        run: npm test
      - name: Check output artifacts
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/Chandrakant_Dubey.pdf
