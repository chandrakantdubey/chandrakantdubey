name: Resolve secure dependency lockfile
on:
  push:
    branches: ["feat/immersive-playground"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve secure lock
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lock if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: resolve patched Zod in Vercel Blob dependency tree"
            git push origin HEAD:feat/immersive-playground
          fi
